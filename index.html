<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>W2W - Word2Word (Online Arcade Edition)</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <!-- โหลดไลบรารี Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { 
      background-color: #0d0f12; 
      color: #e0e6ed; 
      font-family: 'Rajdhani', sans-serif;
      height: 100vh; 
      display: flex; 
      flex-direction: column; 
      justify-content: center; 
      align-items: center; 
      overflow: hidden; 
    }
    
    #start-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #0d0f12;
      z-index: 99998;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }
    .start-title {
      font-size: 8rem;
      font-weight: 700;
      letter-spacing: 12px;
      color: #4ade80;
      text-shadow: 0 0 40px rgba(74, 222, 128, 0.4);
      text-transform: uppercase;
    }
    #initial-btn {
      background: transparent;
      color: #e2e8f0;
      border: 2px solid rgba(255, 255, 255, 0.15);
      padding: 14px 45px;
      font-size: 1.6rem;
      font-weight: 600;
      cursor: pointer;
      border-radius: 8px;
      font-family: 'Rajdhani', sans-serif;
      letter-spacing: 4px;
      transition: all 0.2s ease;
    }
    #initial-btn:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: #4ade80;
      color: #4ade80;
      box-shadow: 0 0 15px rgba(74, 222, 128, 0.2);
    }
    
    #escape-btn {
      display: none;
      position: absolute;
      background: #4ade80;
      color: #0d0f12;
      border: none;
      padding: 14px 45px;
      font-size: 1.6rem;
      font-weight: 600;
      cursor: pointer;
      border-radius: 8px;
      z-index: 100000;
      box-shadow: 0 0 20px rgba(74, 222, 128, 0.4);
      font-family: 'Rajdhani', sans-serif;
      letter-spacing: 4px;
      transition: top 0.15s ease-out, left 0.15s ease-out;
    }
    #escape-btn:hover {
      background: #22c55e;
    }

    .watermark-bg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 35vw; 
      font-weight: 700;
      color: #ffffff;
      opacity: 0.02; 
      z-index: -1; 
      user-select: none; 
      pointer-events: none;
      letter-spacing: 10px;
      transition: opacity 0.5s ease-in-out;
    }

    .hud { 
      position: absolute; 
      top: 25px; 
      font-size: 18px; 
      letter-spacing: 2px; 
      opacity: 0.8; 
      font-weight: 600;
    }

    .exit-fs-btn {
      position: absolute;
      top: 20px;
      right: 75px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.3);
      border-radius: 8px;
      width: 42px;
      height: 42px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.2s ease;
      font-family: 'Rajdhani', sans-serif;
    }
    .exit-fs-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.3);
      color: rgba(255, 255, 255, 0.9);
      transform: scale(1.05);
    }

    .trophy-btn {
      position: absolute;
      top: 20px;
      right: 25px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 20px;
      cursor: pointer;
      z-index: 10;
      transition: all 0.2s ease;
    }
    .trophy-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: scale(1.05);
    }

    .game-container {
      text-align: center;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 100%;
      max-width: 600px;
    }

    .history { 
      font-size: 18px; 
      color: #a0aec0; 
      height: 25px; 
      text-align: center; 
      font-weight: 500;
      letter-spacing: 2px;
    }
    .error-msg { 
      color: #ff4d4d; 
      text-shadow: 0 0 10px rgba(255, 77, 77, 0.4); 
    }

    .arcade-input-screen {
      font-size: 4rem;
      font-weight: 700;
      letter-spacing: 4px;
      color: #4ade80;
      text-shadow: 0 0 20px rgba(74, 222, 128, 0.4);
      min-height: 80px;
      display: flex;
      justify-content: center;
      align-items: center;
      text-transform: uppercase;
    }
    
    .cursor {
      display: inline-block;
      width: 12px;
      height: 45px;
      background-color: #ffffff;
      margin-left: 4px;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
      animation: blink 0.8s infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .streak-minimal {
      font-size: 1.1rem;
      letter-spacing: 2px;
      color: #6c7a8c;
      text-transform: uppercase;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 15px;
      margin-top: 2px;
    }
    .streak-item {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .streak-num {
      color: #38bdf8;
      font-weight: 700;
      font-size: 1.3rem;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }
    .best-num {
      color: #fbbf24;
      font-weight: 700;
      font-size: 1.3rem;
      text-shadow: 0 0 10px rgba(251, 191, 36, 0.5);
    }

    .leaderboard-box {
      margin-top: 15px;
      font-size: 0.9rem;
      letter-spacing: 1px;
      color: #94a3b8;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 12px;
      width: 100%;
      max-width: 350px;
      max-height: 220px;
      overflow-y: auto;
      display: none;
      background: rgba(13, 15, 18, 0.95);
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .leaderboard-title {
      font-weight: 700;
      margin-bottom: 8px;
      color: #4ade80;
      letter-spacing: 2px;
    }
    .score-row {
      display: flex;
      justify-content: space-between;
      padding: 4px 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
    }
    .score-row:nth-child(even) {
      background: rgba(255, 255, 255, 0.02);
    }

    .hidden-input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="start-screen">
    <div class="start-title">W2W</div>
    <button id="initial-btn">PLAY</button>
    <button id="escape-btn">PLAY</button>
  </div>

  <div class="watermark-bg" id="watermark">W2W</div>

  <div class="hud">
    <span id="lives">❤️❤️❤️❤️❤️</span>
  </div>

  <button class="exit-fs-btn" id="exit-fullscreen-btn" title="Exit Fullscreen">✕</button>
  <button class="trophy-btn" id="toggle-leaderboard" title="Toggle Leaderboard">🏆</button>

  <div class="game-container">
    <div class="history" id="status-msg">Loading Dictionary...</div>

    <div class="arcade-input-screen" id="arcade-screen">
      <span id="typed-text"></span><span class="cursor"></span>
    </div>
    
    <div class="streak-minimal">
      <div class="streak-item">STREAK <span class="streak-num" id="streak-counter">0</span></div>
      <span>|</span>
      <div class="streak-item">BEST <span class="best-num" id="best-counter">0</span></div>
    </div>

    <div class="leaderboard-box" id="leaderboard-container">
      <div class="leaderboard-title">ONLINE TOP 25</div>
      <div id="top-scores-list">Loading scores...</div>
    </div>

    <form id="game-form">
      <input type="text" id="word-input" class="hidden-input" autocomplete="off" />
    </form>
  </div>

  <script>
    const SUPABASE_URL = 'https://nafycmwlhczpdgscbeep.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5hZnljbXdsaGN6cGRnc2NiZWVwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5ODM0NjIsImV4cCI6MjEwMjU1OTQ2Mn0.j51QCbQvcy0JCxDshYcIkFf-SyzXCawVVJ3CRWT5NGg';
    
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    (function() {
      const popSound = new Audio('pop.wav');
      popSound.volume = 0.5;

      const deathSound = new Audio('bass_drop.mp3');
      deathSound.volume = 0.35;

      let streak = 0;
      let lives = 5;
      let lastWord = "";
      let requiredPrefix = ""; 
      let lastSubmitTime = 0;
      const usedWords = new Set();
      let dictionary = new Set();
      let escapeCount = 0;

      let leaderboard = [];
      
      const form = document.getElementById('game-form');
      const input = document.getElementById('word-input');
      const typedTextEl = document.getElementById('typed-text');
      const watermarkEl = document.getElementById('watermark');
      const livesEl = document.getElementById('lives');
      const statusEl = document.getElementById('status-msg');
      const streakCounterEl = document.getElementById('streak-counter');
      const bestCounterEl = document.getElementById('best-counter');
      const topScoresListEl = document.getElementById('top-scores-list');
      const trophyBtn = document.getElementById('toggle-leaderboard');
      const exitFsBtn = document.getElementById('exit-fullscreen-btn');
      const leaderboardContainer = document.getElementById('leaderboard-container');

      const startScreen = document.getElementById('start-screen');
      const initialBtn = document.getElementById('initial-btn');
      const escapeBtn = document.getElementById('escape-btn');

      exitFsBtn.addEventListener('click', () => {
        if (document.fullscreenElement) {
          document.exitFullscreen().catch(err => {});
        }
        input.focus();
      });

      trophyBtn.addEventListener('click', () => {
        const isHidden = leaderboardContainer.style.display !== 'block';
        leaderboardContainer.style.display = isHidden ? 'block' : 'none';
        if (isHidden) fetchLeaderboard();
        input.focus();
      });

      async function fetchLeaderboard() {
        const { data, error } = await _supabase
          .from('leaderboard')
          .select('name, score')
          .order('score', { ascending: false })
          .limit(25);

        if (error) {
          topScoresListEl.innerHTML = '<div style="color:#ff4d4d; text-align:center;">Failed to load</div>';
          return;
        }

        leaderboard = data || [];
        if (leaderboard.length > 0) {
          bestCounterEl.innerText = leaderboard[0].score;
        } else {
          bestCounterEl.innerText = "0";
        }

        if (leaderboard.length === 0) {
          topScoresListEl.innerHTML = '<div style="text-align:center; color: #6c7a8c; padding: 10px;">No online scores yet.</div>';
          return;
        }

        topScoresListEl.innerHTML = leaderboard.map((item, index) => {
          return `<div class="score-row">
                    <span>${index + 1}. ${escapeHtml(item.name)}</span>
                    <span style="color: #4ade80; font-weight: 700;">${item.score}</span>
                  </div>`;
        }).join('');
      }

      fetchLeaderboard();

      function escapeHtml(text) {
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }

      async function checkAndSaveScore(currentStreak) {
        if (currentStreak <= 0) return;
        let playerName = prompt(`GAME OVER! Final Streak: ${currentStreak}\nEnter your name for Online Leaderboard:`, "Player");
        if (!playerName || playerName.trim() === "") playerName = "Anonymous";
        
        await _supabase.from('leaderboard').insert([
          { name: playerName.trim().substring(0, 12), score: currentStreak }
        ]);

        await fetchLeaderboard();
      }

      let showStreakBg = false;
      setInterval(() => {
        watermarkEl.style.opacity = 0;
        setTimeout(() => {
          showStreakBg = !showStreakBg;
          watermarkEl.innerText = showStreakBg ? streak : "W2W";
          watermarkEl.style.opacity = 0.02;
        }, 250);
      }, 3000);

      fetch('words_dictionary.json')
        .then(res => res.json())
        .then(data => {
          dictionary = new Set(Object.keys(data));
          statusEl.innerText = "System Ready. Start typing.";
          statusEl.style.color = "#4ade80";
          setTimeout(() => { statusEl.style.color = "#a0aec0"; }, 2000);
        })
        .catch(err => {
          statusEl.innerText = "Error: Dictionary not loaded";
          statusEl.className = "history error-msg";
        });

      input.addEventListener('input', () => {
        let val = input.value.toUpperCase();
        if (requiredPrefix !== "") {
          let reqUpper = requiredPrefix.toUpperCase();
          if (!val.startsWith(reqUpper)) {
            input.value = reqUpper + val.replace(reqUpper, '');
            val = input.value;
          }
        }
        typedTextEl.innerText = val;
      });

      initialBtn.addEventListener('click', () => {
        initialBtn.style.display = 'none';
        escapeBtn.style.display = 'block';
        escapeBtn.style.top = "60%";
        escapeBtn.style.left = "50%";
        escapeBtn.style.transform = "translate(-50%, -50%)";

        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen().catch(err => {});
        }
      });

      window.addEventListener('click', () => {
        input.focus();
      });

      function moveButton() {
        if (escapeCount < 2) {
          escapeCount++;
          const x = Math.random() * (window.innerWidth - escapeBtn.offsetWidth - 100);
          const y = Math.random() * (window.innerHeight - escapeBtn.offsetHeight - 100);
          escapeBtn.style.transform = "none";
          escapeBtn.style.left = `${Math.max(20, x)}px`;
          escapeBtn.style.top = `${Math.max(20, y)}px`;
        }
      }

      escapeBtn.addEventListener('mouseover', moveButton);
      escapeBtn.addEventListener('click', (e) => {
        if (escapeCount < 2) {
          moveButton();
          e.stopPropagation();
        } else {
          startRealGame();
        }
      });

      function startRealGame() {
        startScreen.style.display = 'none';
        input.focus();
        statusEl.innerText = "System Ready. Start typing.";
      }

      form.addEventListener('submit', (e) => {
        e.preventDefault();

        const now = Date.now();
        if (now - lastSubmitTime < 150) {
          handleWrong("Macro Detected! Slow down");
          return;
        }
        lastSubmitTime = now;

        const currentWord = input.value.trim().toLowerCase();
        const currentWordUpper = currentWord.toUpperCase();
        if (!currentWord || currentWord === requiredPrefix.toLowerCase()) return;

        if (dictionary.size > 0 && !dictionary.has(currentWord)) {
          handleWrong(`'${currentWordUpper}' is unknown`);
          return;
        }

        if (usedWords.has(currentWord)) {
          handleWrong("Word already used");
          return;
        }

        if (lastWord !== "") {
          const reqChar = lastWord.slice(-1);
          if (currentWord[0] !== reqChar) {
            handleWrong(`Must start with '${reqChar.toUpperCase()}'`);
            return;
          }
        }

        popSound.currentTime = 0;
        popSound.play().catch(e => {});

        usedWords.add(currentWord);
        lastWord = currentWord;
        streak++;
        streakCounterEl.innerText = streak;

        if (leaderboard.length === 0 || streak > leaderboard[0].score) {
          bestCounterEl.innerText = streak;
        }

        if (showStreakBg) watermarkEl.innerText = streak;
        
        statusEl.className = "history";
        statusEl.innerText = `ACCEPTED: ${currentWordUpper}`;
        
        requiredPrefix = currentWord.slice(-1);
        input.value = requiredPrefix.toUpperCase();
        typedTextEl.innerText = requiredPrefix.toUpperCase();
      });

      function handleWrong(msg) {
        lives--;
        livesEl.innerText = "❤️".repeat(Math.max(0, lives)) + "🖤".repeat(5 - Math.max(0, lives));
        
        statusEl.className = "history error-msg";
        statusEl.innerText = `${msg} [-1 Life]`;
        
        input.value = requiredPrefix.toUpperCase();
        typedTextEl.innerText = requiredPrefix.toUpperCase();

        if (lives <= 0) {
          deathSound.currentTime = 0;
          deathSound.play().catch(e => {});

          setTimeout(async () => {
            await checkAndSaveScore(streak);
            resetGame();
          }, 150);
        }
      }

      function resetGame() {
        streak = 0;
        lives = 5;
        lastWord = "";
        requiredPrefix = "";
        usedWords.clear();
        livesEl.innerText = "❤️❤️❤️❤️❤️";
        streakCounterEl.innerText = "0";
        statusEl.innerText = "System Reset.";
        statusEl.className = "history";
        input.value = "";
        typedTextEl.innerText = "";
      }

    })();

    document.addEventListener('contextmenu', event => event.preventDefault());
  </script>
</body>
</html>
