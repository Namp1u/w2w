<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>W2W Arcade - Game Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { 
      background-color: #0d0f12; 
      color: #e0e6ed; 
      font-family: 'Rajdhani', sans-serif;
      height: 100vh; 
      display: flex; 
      flex-direction: column; 
      justify-content: center; 
      align-items: center; 
      overflow: hidden; 
      position: relative;
    }

    /* --- หน้า LOBBY (เมนูรวมเกม) --- */
    #hub-screen {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: #0d0f12;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 30px;
    }
    .hub-title {
      font-size: 5rem;
      font-weight: 700;
      letter-spacing: 8px;
      color: #4ade80;
      text-shadow: 0 0 30px rgba(74, 222, 128, 0.4);
      text-transform: uppercase;
    }
    .hub-menu {
      display: flex;
      gap: 20px;
    }
    .hub-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(255, 255, 255, 0.15);
      color: #e2e8f0;
      padding: 20px 40px;
      font-size: 1.5rem;
      font-weight: 700;
      cursor: pointer;
      border-radius: 12px;
      font-family: 'Rajdhani', sans-serif;
      letter-spacing: 2px;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 220px;
    }
    .hub-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: #4ade80;
      color: #4ade80;
      box-shadow: 0 0 20px rgba(74, 222, 128, 0.3);
      transform: translateY(-5px);
    }

    /* --- หน้าจอเกม W2W --- */
    #w2w-game-view {
      display: none;
      width: 100%;
      height: 100%;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    #start-screen {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: #0d0f12;
      z-index: 99998;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }
    .start-title {
      font-size: 8rem; font-weight: 700; letter-spacing: 12px;
      color: #4ade80; text-shadow: 0 0 40px rgba(74, 222, 128, 0.4);
      text-transform: uppercase;
    }
    #initial-btn, #escape-btn {
      background: transparent; color: #e2e8f0;
      border: 2px solid rgba(255, 255, 255, 0.15);
      padding: 14px 45px; font-size: 1.6rem; font-weight: 600;
      cursor: pointer; border-radius: 8px; font-family: 'Rajdhani', sans-serif;
      letter-spacing: 4px; transition: all 0.2s ease;
    }
    #escape-btn { display: none; position: absolute; background: #4ade80; color: #0d0f12; z-index: 100000; }

    .watermark-bg {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      font-size: 35vw; font-weight: 700; color: #ffffff; opacity: 0.02; 
      z-index: -1; user-select: none; pointer-events: none; letter-spacing: 10px;
    }

    .hud { position: absolute; top: 25px; left: 25px; font-size: 18px; letter-spacing: 2px; font-weight: 600; }

    .top-right-btns {
      position: absolute; top: 20px; right: 85px; display: flex; gap: 10px; z-index: 10;
    }
    .top-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #e2e8f0; border-radius: 8px; width: 42px; height: 42px;
      font-size: 18px; font-weight: 700; cursor: pointer;
      display: flex; justify-content: center; align-items: center;
      transition: all 0.2s ease; font-family: 'Rajdhani', sans-serif;
    }
    .top-btn:hover { background: rgba(255, 255, 255, 0.15); border-color: #4ade80; color: #4ade80; }

    /* ปุ่มเมนูสไตล์มินิมอล (ขวาบนสุด) */
    .menu-float-btn {
      position: absolute; top: 20px; right: 25px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #e2e8f0; width: 42px; height: 42px; border-radius: 8px;
      font-size: 20px; font-weight: 700; cursor: pointer; z-index: 10;
      display: flex; justify-content: center; align-items: center;
      font-family: 'Rajdhani', sans-serif;
      transition: all 0.2s ease;
    }
    .menu-float-btn:hover { background: rgba(255, 255, 255, 0.15); border-color: #4ade80; color: #4ade80; box-shadow: 0 0 15px rgba(74, 222, 128, 0.3); }

    .game-container {
      text-align: center; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; max-width: 600px;
    }
    .history { font-size: 18px; color: #a0aec0; height: 25px; text-align: center; font-weight: 500; letter-spacing: 2px; }
    .error-msg { color: #ff4d4d; text-shadow: 0 0 10px rgba(255, 77, 77, 0.4); }
    .arcade-input-screen { font-size: 4rem; font-weight: 700; letter-spacing: 4px; color: #4ade80; text-shadow: 0 0 20px rgba(74, 222, 128, 0.4); min-height: 80px; display: flex; justify-content: center; align-items: center; text-transform: uppercase; }
    .cursor { display: inline-block; width: 12px; height: 45px; background-color: #ffffff; margin-left: 4px; animation: blink 0.8s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    .streak-minimal { font-size: 1.1rem; letter-spacing: 2px; color: #6c7a8c; text-transform: uppercase; font-weight: 600; display: flex; align-items: center; gap: 15px; }
    .streak-num { color: #38bdf8; font-weight: 700; font-size: 1.3rem; }
    .best-num { color: #fbbf24; font-weight: 700; font-size: 1.3rem; }

    .leaderboard-box {
      margin-top: 15px; font-size: 0.9rem; letter-spacing: 1px; color: #94a3b8;
      border-top: 1px solid rgba(255, 255, 255, 0.05); padding-top: 12px;
      width: 100%; max-width: 350px; max-height: 220px; overflow-y: auto; display: none;
      background: rgba(13, 15, 18, 0.95); border-radius: 8px; padding: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .score-row { display: flex; justify-content: space-between; padding: 4px 8px; border-bottom: 1px solid rgba(255, 255, 255, 0.03); }

    /* --- หน้าจอเกมแมวอ้าปาก --- */
    #cat-game-view {
      display: none;
      width: 100%; height: 100%;
      flex-direction: column; justify-content: center; align-items: center; gap: 20px;
    }
    .cat-box {
      position: relative; width: 360px; height: 280px; background: #161b22;
      border: 3px solid rgba(255, 255, 255, 0.1); border-radius: 20px;
      display: flex; flex-direction: column; justify-content: space-between; padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    .teeth-row { display: flex; justify-content: space-around; gap: 8px; }
    .tooth {
      width: 35px; height: 45px; background: #e2e8f0; border: none;
      border-radius: 6px 6px 12px 12px; cursor: pointer; font-weight: 700;
      font-family: 'Rajdhani', sans-serif; font-size: 1rem; color: #0d0f12; transition: all 0.15s ease;
    }
    .tooth:hover:not(:disabled) { background: #4ade80; transform: translateY(-3px); }
    .tooth:disabled { background: #334155; color: #64748b; cursor: not-allowed; }
    .tooth.bitten { background: #ef4444 !important; color: white; animation: shake 0.3s ease; }
    .cat-box.chomp { border-color: #ef4444; animation: shake 0.3s ease; }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
    .cat-face-indicator { font-size: 4rem; user-select: none; margin: 10px 0; text-align: center; }

    .hidden-input { position: absolute; opacity: 0; pointer-events: none; }
  </style>
</head>
<body>

  <!-- ================= LOBBY SCREEN (เมนูรวมเกม) ================= -->
  <div id="hub-screen">
    <div class="hub-title">ARCADE HUB</div>
    <div class="hub-menu">
      <button class="hub-btn" onclick="openGame('w2w')">
        <span style="font-size: 2.5rem;">🔤</span>
        W2W GAME
      </button>
      <button class="hub-btn" onclick="openGame('cat')">
        <span style="font-size: 2.5rem;">😼</span>
        CAT DENTIST
      </button>
    </div>
  </div>


  <!-- ================= W2W GAME VIEW ================= -->
  <div id="w2w-game-view">
    <div id="start-screen">
      <div class="start-title">W2W</div>
      <button id="initial-btn">PLAY</button>
      <button id="escape-btn">PLAY</button>
    </div>

    <div class="watermark-bg" id="watermark">W2W</div>
    <div class="hud"><span id="lives">❤️❤️❤️❤️❤️</span></div>

    <div class="top-right-btns">
      <button class="top-btn" id="exit-fullscreen-btn" title="Exit Fullscreen">✕</button>
      <button class="top-btn" id="toggle-leaderboard" title="Toggle Leaderboard">🏆</button>
    </div>

    <!-- ปุ่มเมนูไอคอน ☰ มุมขวาบน -->
    <button class="menu-float-btn" onclick="goToHub()" title="Back to Hub">☰</button>

    <div class="game-container">
      <div class="history" id="status-msg">System Ready.</div>
      <div class="arcade-input-screen" id="arcade-screen">
        <span id="typed-text"></span><span class="cursor"></span>
      </div>
      
      <div class="streak-minimal">
        <div class="streak-item">STREAK <span class="streak-num" id="streak-counter">0</span></div>
        <span>|</span>
        <div class="streak-item">BEST <span class="best-num" id="best-counter">0</span></div>
      </div>

      <div class="leaderboard-box" id="leaderboard-container">
        <div style="font-weight: 700; margin-bottom: 8px; color: #4ade80; letter-spacing: 2px;">ONLINE TOP 25</div>
        <div id="top-scores-list">Loading scores...</div>
      </div>

      <form id="game-form">
        <input type="text" id="word-input" class="hidden-input" autocomplete="off" />
      </form>
    </div>
  </div>


  <!-- ================= CAT DENTIST VIEW ================= -->
  <div id="cat-game-view">
    <button class="menu-float-btn" onclick="goToHub()" title="Back to Hub">☰</button>
    <div style="font-size: 3rem; font-weight: 700; color: #4ade80; letter-spacing: 4px;">CAT DENTIST</div>
    <div class="history" id="cat-status-msg">จิ้มฟันแมวทีละซี่ ระวังโดนงับ!</div>

    <div class="cat-box" id="cat-box">
      <div class="teeth-row">
        <button class="tooth" data-index="0">1</button>
        <button class="tooth" data-index="1">2</button>
        <button class="tooth" data-index="2">3</button>
        <button class="tooth" data-index="3">4</button>
        <button class="tooth" data-index="4">5</button>
      </div>
      <div class="cat-face-indicator" id="cat-face">😼</div>
      <div class="teeth-row">
        <button class="tooth" data-index="5">6</button>
        <button class="tooth" data-index="6">7</button>
        <button class="tooth" data-index="7">8</button>
        <button class="tooth" data-index="8">9</button>
        <button class="tooth" data-index="9">10</button>
      </div>
    </div>
    <button class="hub-btn" id="cat-reset-btn" style="display:none; width: auto; padding: 10px 30px;" onclick="initCatGame()">PLAY AGAIN</button>
  </div>


  <script>
    const SUPABASE_URL = 'https://nafycmwlhczpdgscbeep.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5hZnljbXdsaGN6cGRnc2NiZWVwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5ODM0NjIsImV4cCI6MjEwMjU1OTQ2Mn0.j51QCbQvcy0JCxDshYcIkFf-SyzXCawVVJ3CRWT5NGg';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // --- ระบบสลับหน้าจอ Hub / Games ---
    function openGame(gameName) {
      document.getElementById('hub-screen').style.display = 'none';
      if(gameName === 'w2w') {
        document.getElementById('w2w-game-view').style.display = 'flex';
        document.getElementById('word-input').focus();
      } else if(gameName === 'cat') {
        document.getElementById('cat-game-view').style.display = 'flex';
        initCatGame();
      }
    }

    function goToHub() {
      document.getElementById('w2w-game-view').style.display = 'none';
      document.getElementById('cat-game-view').style.display = 'none';
      document.getElementById('hub-screen').style.display = 'flex';
    }


    // --- โค้ดเกม W2W ---
    let streak = 0;
    let lives = 5;
    let lastWord = "";
    let requiredPrefix = ""; 
    let lastSubmitTime = 0;
    const usedWords = new Set();
    let dictionary = new Set();
    let escapeCount = 0;
    let leaderboard = [];

    const popSound = new Audio('pop.wav'); popSound.volume = 0.5;
    const deathSound = new Audio('bass_drop.mp3'); deathSound.volume = 0.35;

    const form = document.getElementById('game-form');
    const input = document.getElementById('word-input');
    const typedTextEl = document.getElementById('typed-text');
    const watermarkEl = document.getElementById('watermark');
    const livesEl = document.getElementById('lives');
    const statusEl = document.getElementById('status-msg');
    const streakCounterEl = document.getElementById('streak-counter');
    const bestCounterEl = document.getElementById('best-counter');
    const topScoresListEl = document.getElementById('top-scores-list');
    const trophyBtn = document.getElementById('toggle-leaderboard');
    const exitFsBtn = document.getElementById('exit-fullscreen-btn');
    const leaderboardContainer = document.getElementById('leaderboard-container');
    const startScreen = document.getElementById('start-screen');
    const initialBtn = document.getElementById('initial-btn');
    const escapeBtn = document.getElementById('escape-btn');

    exitFsBtn.addEventListener('click', () => {
      if (document.fullscreenElement) document.exitFullscreen().catch(err => {});
      input.focus();
    });

    trophyBtn.addEventListener('click', () => {
      const isHidden = leaderboardContainer.style.display !== 'block';
      leaderboardContainer.style.display = isHidden ? 'block' : 'none';
      if (isHidden) fetchLeaderboard();
      input.focus();
    });

    async function fetchLeaderboard() {
      const { data } = await _supabase.from('leaderboard').select('name, score').order('score', { ascending: false }).limit(25);
      leaderboard = data || [];
      bestCounterEl.innerText = leaderboard.length > 0 ? leaderboard[0].score : "0";
      if (leaderboard.length === 0) {
        topScoresListEl.innerHTML = '<div style="text-align:center; color: #6c7a8c; padding: 10px;">No online scores yet.</div>';
        return;
      }
      topScoresListEl.innerHTML = leaderboard.map((item, index) => 
        `<div class="score-row"><span>${index + 1}. ${item.name}</span><span style="color: #4ade80; font-weight: 700;">${item.score}</span></div>`
      ).join('');
    }
    fetchLeaderboard();

    async function checkAndSaveScore(currentStreak) {
      if (currentStreak <= 0) return;
      let playerName = prompt(`GAME OVER! Final Streak: ${currentStreak}\nEnter your name for Online Leaderboard:`, "Player");
      if (!playerName || playerName.trim() === "") playerName = "Anonymous";
      await _supabase.from('leaderboard').insert([{ name: playerName.trim().substring(0, 12), score: currentStreak }]);
      fetchLeaderboard();
    }

    fetch('words_dictionary.json')
      .then(res => res.json())
      .then(data => { dictionary = new Set(Object.keys(data)); });

    input.addEventListener('input', () => {
      let val = input.value.toUpperCase();
      if (requiredPrefix !== "") {
        let reqUpper = requiredPrefix.toUpperCase();
        if (!val.startsWith(reqUpper)) {
          input.value = reqUpper + val.replace(reqUpper, '');
          val = input.value;
        }
      }
      typedTextEl.innerText = val;
    });

    initialBtn.addEventListener('click', () => {
      initialBtn.style.display = 'none';
      escapeBtn.style.display = 'block';
      escapeBtn.style.top = "60%"; escapeBtn.style.left = "50%"; escapeBtn.style.transform = "translate(-50%, -50%)";
      if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(err => {});
    });

    window.addEventListener('click', () => { if(document.getElementById('w2w-game-view').style.display === 'flex') input.focus(); });

    escapeBtn.addEventListener('mouseover', () => {
      if (escapeCount < 2) {
        escapeCount++;
        escapeBtn.style.transform = "none";
        escapeBtn.style.left = `${Math.random() * (window.innerWidth - 150)}px`;
        escapeBtn.style.top = `${Math.random() * (window.innerHeight - 100)}px`;
      }
    });
    escapeBtn.addEventListener('click', () => {
      if (escapeCount >= 2) startScreen.style.display = 'none';
      input.focus();
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const currentWord = input.value.trim().toLowerCase();
      const currentWordUpper = currentWord.toUpperCase();
      if (!currentWord || currentWord === requiredPrefix.toLowerCase()) return;

      if (dictionary.size > 0 && !dictionary.has(currentWord)) { handleWrong(`'${currentWordUpper}' unknown`); return; }
      if (usedWords.has(currentWord)) { handleWrong("Word used"); return; }
      if (lastWord !== "" && currentWord[0] !== lastWord.slice(-1)) { handleWrong("Wrong prefix"); return; }

      popSound.currentTime = 0; popSound.play().catch(e => {});
      usedWords.add(currentWord);
      lastWord = currentWord;
      streak++;
      streakCounterEl.innerText = streak;
      statusEl.innerText = `ACCEPTED: ${currentWordUpper}`;
      requiredPrefix = currentWord.slice(-1);
      input.value = requiredPrefix.toUpperCase();
      typedTextEl.innerText = requiredPrefix.toUpperCase();
    });

    function handleWrong(msg) {
      lives--;
      livesEl.innerText = "❤️".repeat(Math.max(0, lives)) + "🖤".repeat(5 - Math.max(0, lives));
      statusEl.className = "history error-msg";
      statusEl.innerText = `${msg} [-1 Life]`;
      input.value = requiredPrefix.toUpperCase();
      typedTextEl.innerText = requiredPrefix.toUpperCase();

      if (lives <= 0) {
        deathSound.currentTime = 0; deathSound.play().catch(e => {});
        setTimeout(async () => {
          await checkAndSaveScore(streak);
          resetGame();
        }, 150);
      }
    }

    function resetGame() {
      streak = 0; lives = 5; lastWord = ""; requiredPrefix = ""; usedWords.clear();
      livesEl.innerText = "❤️❤️❤️❤️❤️"; streakCounterEl.innerText = "0";
      statusEl.innerText = "System Reset."; statusEl.className = "history";
      input.value = ""; typedTextEl.innerText = "";
    }


    // --- โค้ดเกมแมวอ้าปาก ---
    let trapTooth = 0;
    let catGameOver = false;
    const teethButtons = document.querySelectorAll('#cat-game-view .tooth');
    const catStatus = document.getElementById('cat-status-msg');
    const catBox = document.getElementById('cat-box');
    const catFace = document.getElementById('cat-face');
    const catResetBtn = document.getElementById('cat-reset-btn');

    function initCatGame() {
      trapTooth = Math.floor(Math.random() * 10);
      catGameOver = false;
      catBox.classList.remove('chomp');
      catFace.innerText = "😼";
      catStatus.innerText = "จิ้มฟันแมวทีละซี่ ระวังโดนงับ!";
      catStatus.style.color = "#a0aec0";
      catResetBtn.style.display = 'none';

      teethButtons.forEach(btn => {
        btn.disabled = false;
        btn.classList.remove('bitten');
        btn.style.background = "#e2e8f0";
        btn.style.color = "#0d0f12";
      });
    }

    teethButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        if (catGameOver) return;
        const index = parseInt(btn.dataset.index);
        btn.disabled = true;

        if (index === trapTooth) {
          catGameOver = true;
          btn.classList.add('bitten');
          catBox.classList.add('chomp');
          catFace.innerText = "🙀";
          catStatus.innerText = "¡CHOMP! โดนงับแล้ว! ดื่ม!";
          catStatus.style.color = "#ef4444";
          deathSound.currentTime = 0; deathSound.play().catch(e => {});
          teethButtons.forEach(b => b.disabled = true);
          catResetBtn.style.display = 'block';
        } else {
          btn.style.background = "#334155";
          btn.style.color = "#64748b";
          catStatus.innerText = "รอดไป! ส่งตาถัดไปจิ้มต่อ";
          catStatus.style.color = "#4ade80";
          popSound.currentTime = 0; popSound.play().catch(e => {});
        }
      });
    });
  </script>
</body>
</html>
