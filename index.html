<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>W2W - Word2Word (Secure Arcade Edition)</title>
  <!-- ดึงฟอนต์แห่งอนาคต Rajdhani มาจาก Google -->
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { 
      background-color: #0d0f12; 
      color: #e0e6ed; 
      font-family: 'Rajdhani', sans-serif;
      height: 100vh; 
      display: flex; 
      flex-direction: column; 
      justify-content: center; 
      align-items: center; 
      overflow: hidden; 
    }
    
    /* ลายน้ำด้านหลังสลับแสดง W2W กับ Streak */
    .watermark-bg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 35vw; 
      font-weight: 700;
      color: #ffffff;
      opacity: 0.02; 
      z-index: -1; 
      user-select: none; 
      pointer-events: none;
      letter-spacing: 10px;
      transition: opacity 0.5s ease-in-out;
    }

    /* หัวใจด้านบน */
    .hud { 
      position: absolute; 
      top: 25px; 
      font-size: 18px; 
      letter-spacing: 2px; 
      opacity: 0.8; 
      font-weight: 600;
    }

    /* ปุ่มรูปถ้วยรางวัลมุมขวาบน */
    .trophy-btn {
      position: absolute;
      top: 20px;
      right: 25px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 20px;
      cursor: pointer;
      z-index: 10;
      transition: all 0.2s ease;
    }
    .trophy-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: scale(1.05);
    }

    .game-container {
      text-align: center;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 100%;
      max-width: 600px;
    }

    /* ข้อความสถานะเกม */
    .history { 
      font-size: 18px; 
      color: #a0aec0; 
      height: 25px; 
      text-align: center; 
      font-weight: 500;
      letter-spacing: 2px;
    }
    .error-msg { 
      color: #ff4d4d; 
      text-shadow: 0 0 10px rgba(255, 77, 77, 0.4); 
    }

    /* UI ช่องพิมพ์ตรงกลางจอแบบรวมเป็นบรรทัดเดียว */
    .arcade-input-screen {
      font-size: 4rem;
      font-weight: 700;
      letter-spacing: 4px;
      color: #4ade80;
      text-shadow: 0 0 20px rgba(74, 222, 128, 0.4);
      min-height: 80px;
      display: flex;
      justify-content: center;
      align-items: center;
      text-transform: lowercase;
    }
    
    /* ขีดกระพริบเปลี่ยนเป็นสีขาว */
    .cursor {
      display: inline-block;
      width: 12px;
      height: 45px;
      background-color: #ffffff;
      margin-left: 4px;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
      animation: blink 0.8s infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Minimal Streak ด้านล่างช่องพิมพ์ */
    .streak-minimal {
      font-size: 1.1rem;
      letter-spacing: 2px;
      color: #6c7a8c;
      text-transform: uppercase;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 15px;
      margin-top: 2px;
    }
    .streak-item {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .streak-num {
      color: #38bdf8;
      font-weight: 700;
      font-size: 1.3rem;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }
    .best-num {
      color: #fbbf24;
      font-weight: 700;
      font-size: 1.3rem;
      text-shadow: 0 0 10px rgba(251, 191, 36, 0.5);
    }

    /* Leaderboard ด้านล่างสุดแบบซ่อนค่าเริ่มต้น */
    .leaderboard-box {
      margin-top: 10px;
      font-size: 0.9rem;
      letter-spacing: 1px;
      color: #6c7a8c;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 10px;
      width: 80%;
      display: none; /* ซ่อนไว้ก่อนตามคำขอ */
    }
    .leaderboard-title {
      font-weight: 600;
      margin-bottom: 4px;
      color: #94a3b8;
    }
    #top-scores {
      font-weight: 700;
      color: #e2e8f0;
    }

    .hidden-input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- ลายน้ำด้านหลังสลับ W2W กับ Streak -->
  <div class="watermark-bg" id="watermark">W2W</div>

  <!-- หัวใจด้านบน -->
  <div class="hud">
    <span id="lives">❤️❤️❤️❤️❤️</span>
  </div>

  <!-- ปุ่มรูปถ้วยรางวัลสำหรับเปิด/ปิด Leaderboard -->
  <button class="trophy-btn" id="toggle-leaderboard" title="Toggle Leaderboard">🏆</button>

  <div class="game-container">
    
    <!-- ข้อความสถานะเกม -->
    <div class="history" id="status-msg">Loading Dictionary...</div>

    <!-- ช่องพิมพ์ Arcade รวมตัวอักษรบังคับไว้บรรทัดเดียวกัน -->
    <div class="arcade-input-screen" id="arcade-screen">
      <span id="typed-text"></span><span class="cursor"></span>
    </div>
    
    <!-- Minimal Streak & Best Streak ด้านล่างช่องพิมพ์ -->
    <div class="streak-minimal">
      <div class="streak-item">STREAK <span class="streak-num" id="streak-counter">0</span></div>
      <span>|</span>
      <div class="streak-item">BEST <span class="best-num" id="best-counter">0</span></div>
    </div>

    <!-- Leaderboard มินิมอล (ซ่อนอยู่ จะแสดงเมื่อกดปุ่ม 🏆) -->
    <div class="leaderboard-box" id="leaderboard-container">
      <div class="leaderboard-title">TOP STREAKS (LOCAL LEADERBOARD)</div>
      <div id="top-scores">1. --- (0) | 2. --- (0) | 3. --- (0)</div>
    </div>

    <!-- ฟอร์มช่องพิมพ์ที่ซ่อนไว้เบื้องหลัง -->
    <form id="game-form">
      <input type="text" id="word-input" class="hidden-input" autocomplete="off" autofocus />
    </form>
    
  </div>

  <script>
    (function() {
      const popSound = new Audio('pop.wav');
      popSound.volume = 0.5;

      const deathSound = new Audio('bass_drop.mp3');
      deathSound.volume = 0.35;

      let streak = 0;
      let lives = 5;
      let lastWord = "";
      let requiredPrefix = ""; 
      let lastSubmitTime = 0;
      const usedWords = new Set();
      let dictionary = new Set();

      let leaderboard = JSON.parse(localStorage.getItem('w2w_named_leaderboard')) || [
        {name: "---", score: 0},
        {name: "---", score: 0},
        {name: "---", score: 0}
      ];
      
      const form = document.getElementById('game-form');
      const input = document.getElementById('word-input');
      const typedTextEl = document.getElementById('typed-text');
      const watermarkEl = document.getElementById('watermark');
      const livesEl = document.getElementById('lives');
      const statusEl = document.getElementById('status-msg');
      const streakCounterEl = document.getElementById('streak-counter');
      const bestCounterEl = document.getElementById('best-counter');
      const topScoresEl = document.getElementById('top-scores');
      const trophyBtn = document.getElementById('toggle-leaderboard');
      const leaderboardContainer = document.getElementById('leaderboard-container');

      // ระบบกดปุ่ม 🏆 เพื่อเปิด/ปิดตาราง Leaderboard
      trophyBtn.addEventListener('click', () => {
        if (leaderboardContainer.style.display === 'block') {
          leaderboardContainer.style.display = 'none';
        } else {
          leaderboardContainer.style.display = 'block';
        }
        input.focus(); // โฟกัสกลับมาที่ช่องพิมพ์เกมเหมือนเดิม
      });

      updateLeaderboardDisplay();

      function updateLeaderboardDisplay() {
        bestCounterEl.innerText = leaderboard[0].score;
        topScoresEl.innerHTML = leaderboard.map((item, index) => `${index + 1}. ${item.name} (${item.score})`).join(' &nbsp;|&nbsp; ');
      }

      function checkAndSaveScore(currentStreak) {
        if (currentStreak <= 0) return;
        let playerName = prompt(`GAME OVER! Final Streak: ${currentStreak}\nEnter your name for the Leaderboard:`, "Player");
        if (!playerName || playerName.trim() === "") playerName = "Anonymous";
        
        leaderboard.push({ name: playerName.trim().substring(0, 10), score: currentStreak });
        leaderboard.sort((a, b) => b.score - a.score);
        leaderboard = leaderboard.slice(0, 3);
        
        localStorage.setItem('w2w_named_leaderboard', JSON.stringify(leaderboard));
        updateLeaderboardDisplay();
      }

      let showStreakBg = false;
      setInterval(() => {
        watermarkEl.style.opacity = 0;
        setTimeout(() => {
          showStreakBg = !showStreakBg;
          watermarkEl.innerText = showStreakBg ? streak : "W2W";
          watermarkEl.style.opacity = 0.02;
        }, 250);
      }, 3000);

      fetch('words_dictionary.json')
        .then(res => res.json())
        .then(data => {
          dictionary = new Set(Object.keys(data));
          statusEl.innerText = "System Ready. Start typing.";
          statusEl.style.color = "#4ade80";
          setTimeout(() => { statusEl.style.color = "#a0aec0"; }, 2000);
        })
        .catch(err => {
          statusEl.innerText = "Error: Please run via Server";
          statusEl.className = "history error-msg";
        });

      input.addEventListener('input', () => {
        let val = input.value.toLowerCase();
        
        if (requiredPrefix !== "") {
          if (!val.startsWith(requiredPrefix)) {
            input.value = requiredPrefix + val.replace(requiredPrefix, '');
          }
        }
        
        typedTextEl.innerText = input.value;
      });

      window.addEventListener('click', () => {
        input.focus();
      });

      form.addEventListener('submit', (e) => {
        e.preventDefault();

        const now = Date.now();
        if (now - lastSubmitTime < 150) {
          handleWrong("Macro Detected! Slow down");
          return;
        }
        lastSubmitTime = now;

        const currentWord = input.value.trim().toLowerCase();
        if (!currentWord || currentWord === requiredPrefix) return;

        if (dictionary.size > 0 && !dictionary.has(currentWord)) {
          handleWrong(`'${currentWord.toUpperCase()}' is unknown`);
          return;
        }

        if (usedWords.has(currentWord)) {
          handleWrong("Word already used");
          return;
        }

        if (lastWord !== "") {
          const reqChar = lastWord.slice(-1);
          if (currentWord[0] !== reqChar) {
            handleWrong(`Must start with '${reqChar.toUpperCase()}'`);
            return;
          }
        }

        popSound.currentTime = 0;
        popSound.play().catch(e => {});

        usedWords.add(currentWord);
        lastWord = currentWord;
        streak++;
        streakCounterEl.innerText = streak;

        if (streak > leaderboard[0].score) {
          bestCounterEl.innerText = streak;
        }

        if (showStreakBg) watermarkEl.innerText = streak;
        
        statusEl.className = "history";
        statusEl.innerText = `ACCEPTED: ${currentWord.toUpperCase()}`;
        
        requiredPrefix = currentWord.slice(-1);
        input.value = requiredPrefix;
        typedTextEl.innerText = requiredPrefix;
      });

      function handleWrong(msg) {
        lives--;
        livesEl.innerText = "❤️".repeat(Math.max(0, lives)) + "🖤".repeat(5 - Math.max(0, lives));
        
        statusEl.className = "history error-msg";
        statusEl.innerText = `${msg} [-1 Life]`;
        
        input.value = requiredPrefix;
        typedTextEl.innerText = requiredPrefix;

        if (lives <= 0) {
          deathSound.currentTime = 0;
          deathSound.play().catch(e => {});

          setTimeout(() => {
            checkAndSaveScore(streak);
            resetGame();
          }, 150);
        }
      }

      function resetGame() {
        streak = 0;
        lives = 5;
        lastWord = "";
        requiredPrefix = "";
        usedWords.clear();
        livesEl.innerText = "❤️❤️❤️❤️❤️";
        streakCounterEl.innerText = "0";
        statusEl.innerText = "System Reset.";
        statusEl.className = "history";
        input.value = "";
        typedTextEl.innerText = "";
        updateLeaderboardDisplay();
      }

    })();

    document.addEventListener('contextmenu', event => event.preventDefault());
  </script>
</body>
</html>
